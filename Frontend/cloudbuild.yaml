# Build and push the frontend image.
#
#   gcloud builds submit --config Frontend/cloudbuild.yaml \
#     --substitutions=_API_URL=https://canon-backend-...run.app Frontend
#
# Context is Frontend/, not the repo root: the React app needs nothing from backend/,
# and a smaller context is a faster upload on a slow connection.

substitutions:
  _REGION: us-central1
  _REPO: backend
  _IMAGE: canon-frontend
  _TAG: latest
  _API_URL: http://localhost:8000

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_API_URL=${_API_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
